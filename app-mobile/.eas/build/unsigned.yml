# App per iPhone senza firma: la firma la mette Sideloadly con l'Apple ID
# gratuito al momento dell'installazione (vedi docs/installazione-iphone.md).
build:
  name: iPhone senza firma
  steps:
    - eas/checkout
    - run:
        name: Controlla la configurazione del backend
        command: |
          # Senza src/config.ts app e widget puntano a localhost: meglio fallire qui.
          grep -q 'API_BASE_URL = "https' src/config.ts
    - eas/install_node_modules
    - eas/prebuild
    - run:
        name: Pod install
        working_directory: ios
        command: |
          grep -q 'baseURL = "https' ../targets/widget/Config.generated.swift
          pod install
    - run:
        name: Compila senza firma
        working_directory: ios
        command: |
          set -eo pipefail
          xcodebuild -version
          xcodebuild -workspace MBCompanion.xcworkspace -scheme MBCompanion -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath build/MBCompanion.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive > build.log 2>&1 || { grep -E "error:" build.log | head -60; tail -120 build.log; exit 1; }
          tail -3 build.log
          rm -rf Payload MBCompanion.ipa
          mkdir Payload
          cp -R build/MBCompanion.xcarchive/Products/Applications/MBCompanion.app Payload/
          ls Payload/MBCompanion.app/PlugIns
          zip -qry MBCompanion.ipa Payload
          # eas/upload_artifact risolve i percorsi dalla radice del caricamento
          # (la cartella sopra app-mobile), non da working_directory.
          ls -la "$PWD/MBCompanion.ipa"
    - eas/upload_artifact:
        name: Carica IPA
        inputs:
          path: /Users/expo/workingdir/build/app-mobile/ios/MBCompanion.ipa
