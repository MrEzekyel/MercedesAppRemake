services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: mbcompanion
      POSTGRES_PASSWORD: mbcompanion
      POSTGRES_DB: mbcompanion
    ports:
      - "5432:5432"
    volumes:
      - mb_db_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mbcompanion"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mb_db_data:
